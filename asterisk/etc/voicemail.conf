; payphone-phreak-lab :: voicemail.conf
; A real mailbox is provided for flavour / an optional "leave a message for
; the SysOp" feature. CH4 ("default credentials") is handled directly in the
; dialplan so the game works with no pre-recorded messages, but you can wire
; VoicemailMain(1337@phreak) to this mailbox if you record a greeting.
[general]
format = wav49|gsm|wav
attach = no
maxmsg = 50
maxsecs = 120
minsecs = 2
skipms = 3000
maxsilence = 10
silencethreshold = 128

[phreak]
; mailbox => password,Full Name,email,pager,options
1337 => 1337,Default Creds Demo
2600 => 2600,Blue Box
1971 => 1971,Esquire 71
