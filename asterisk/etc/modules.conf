; payphone-phreak-lab :: modules.conf
; Autoload everything, then make sure the bits the CTF needs are present.
[modules]
autoload = yes

; Explicitly load the essentials (harmless if already autoloaded).
preload = res_pjsip.so
load = res_pjsip.so
load = res_pjsip_session.so
load = chan_pjsip.so
load = app_playback.so
load = app_read.so
load = app_milliwatt.so
load = app_verbose.so
load = app_dial.so
load = app_stack.so
load = res_agi.so
load = app_senddtmf.so
load = pbx_config.so
load = func_callerid.so
load = func_strings.so
load = func_logic.so
