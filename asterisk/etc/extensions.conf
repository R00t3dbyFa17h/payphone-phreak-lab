; =====================================================================
; payphone-phreak-lab :: extensions.conf  (THE CTF DIALPLAN / "the game")
; Author: R00t3dbyFa17h / K70n0s510
;
; This dialplan turns an Asterisk PBX into a phone-phreaking CTF for a
; meetup. Players dial a hacked-up 1980s-style phone network, solve
; challenges, and dial recovered FLAG codes into the Flag Terminal (700)
; to score on the live web scoreboard.
;
; Context layout (keeps single-digit menu keys from colliding with the
; multi-digit game numbers):
;   [from-phones]    where every device lands; includes [phreak-numbers]
;   [phreak-numbers] the real, directly-dialable numbers (100, 411, 2600, ...)
;   [phreak-menu]    the IVR: single-digit shortcuts, only reached via 100
;
; Runs with ONLY stock asterisk-core-sounds-en: flags/codes are spoken with
; SayDigits, narration uses built-in prompts + a beep before each flag.
; Record custom prompts into /var/lib/asterisk/sounds (see docs) for flavour.
;
; LEGAL/ETHICS: everything runs against YOUR OWN PBX. The 2600 Hz / blue-box /
; red-box material is HISTORICAL and only drives puzzles on this lab box.
; Modern networks don't use in-band MF signalling; using these against real
; carriers is illegal and pointless. Teach the history. See PHREAKING_101.md.
; =====================================================================

[globals]
OPERATOR=PJSIP/operator          ; where "0" rings (an organizer's softphone)

; ---------------------------------------------------------------------
; Entry context: every phone/ATA/payphone lands here (see pjsip.conf).
; ---------------------------------------------------------------------
[from-phones]
exten => s,1,NoOp(Off-hook from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(phreak-menu,s,1)        ; no digits dialed -> main menu

include => phreak-numbers

; =====================================================================
; MAIN IVR MENU  -- reached by dialing 100 or going off-hook
; Single-digit keys live ONLY here, matched inside WaitExten, so they
; never collide with the multi-digit game numbers.
; =====================================================================
[phreak-menu]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=4)
 same => n,Set(TIMEOUT(response)=10)
 same => n(top),Background(hello-world)        ; replace w/ custom 'welcome'
 same => n,Background(vm-options)              ; "press 1.." style filler
 same => n,WaitExten(10)
 same => n,Goto(top)

exten => 1,1,Goto(phreak-numbers,411,1)        ; Directory
exten => 2,1,Goto(phreak-numbers,2600,1)       ; The 2600 line
exten => 3,1,Goto(phreak-numbers,767,1)        ; DISA
exten => 4,1,Goto(phreak-numbers,5000,1)       ; Voicemail
exten => 5,1,Goto(phreak-numbers,322,1)        ; DTMF decode
exten => 6,1,Goto(phreak-numbers,6000,1)       ; The Maze
exten => 7,1,Goto(phreak-numbers,958,1)        ; ANAC
exten => 8,1,Goto(phreak-numbers,600,1)        ; Milliwatt
exten => 9,1,Goto(phreak-numbers,700,1)        ; FLAG TERMINAL
exten => 0,1,Goto(phreak-numbers,0,1)          ; Operator
exten => i,1,Playback(invalid)
 same => n,Goto(s,top)
exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

; =====================================================================
; GAME NUMBERS  (directly dialable; also where the menu jumps to)
; =====================================================================
[phreak-numbers]

; --- Main menu entry ------------------------------------------------
exten => 100,1,Goto(phreak-menu,s,1)

; --- Operator -------------------------------------------------------
exten => 0,1,NoOp(Operator)
 same => n,Answer()
 same => n,Playback(one-moment-please)
 same => n,Dial(${OPERATOR},30)
 same => n,Playback(vm-nobodyavail)
 same => n,Hangup()

; --- Team score readout ---------------------------------------------
exten => 200,1,Answer()
 same => n,Read(TEAM,vm-enter-num-to-call,3,,2,6)
 same => n,AGI(scoreboard_status.py,${TEAM})
 same => n,SayDigits(${TEAM})
 same => n,SayNumber(${TEAMSCORE})
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; --- CH1: Directory Assistance (enumeration) ------------------------
; Reads SOME extensions but NOT the secret one (1971). Players who poke
; around / scan the keypad find the hidden Esquire-'71 line.
exten => 411,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(vm-extension)
 same => n,SayDigits(2600)
 same => n,Playback(vm-extension)
 same => n,SayDigits(767)
 same => n,Playback(vm-extension)
 same => n,SayDigits(5000)
 same => n,Playback(vm-and)
 same => n,Playback(more)
 same => n,Hangup()

; The HIDDEN line (Esquire, Oct 1971 "Secrets of the Little Blue Box").
exten => 1971,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Playback(beep)
 same => n,SayDigits(448162)          ; FLAG CH1
 same => n,SayDigits(448162)
 same => n,Hangup()

; --- CH2: The 2600 Line (blue box history) --------------------------
exten => 2600,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(beep)
 same => n,SayDigits(262600)          ; FLAG CH2
 same => n,SayDigits(262600)
 same => n,Hangup()

; --- CH3: DISA (Direct Inward System Access) misconfig --------------
; Classic phreak target: a maintenance port with a weak/guessable PIN.
; PIN is 2600 (hinted by the 2600 line / phreak lore).
exten => 767,1,Answer()                ; 767 = "POP"
 same => n,Playback(hello-world)
 same => n(ask),Read(PIN,vm-password,4,,3,6)
 same => n,GotoIf($["${PIN}" = "2600"]?ok:bad)
 same => n(bad),Playback(vm-incorrect)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
 same => n(ok),Playback(auth-thankyou)
 same => n,Playback(beep)
 same => n,SayDigits(773355)          ; FLAG CH3
 same => n,SayDigits(773355)
 same => n,Hangup()

; --- CH4: Voicemail with DEFAULT credentials ------------------------
; Teaches "default PIN == mailbox number". Mailbox 1337, PIN 1337.
exten => 5000,1,Answer()
 same => n,Playback(vm-login)
 same => n,Read(MBOX,vm-mailbox,4,,3,6)
 same => n,Read(VPIN,vm-password,4,,3,6)
 same => n,GotoIf($["${MBOX}" = "1337" & "${VPIN}" = "1337"]?ok:bad)
 same => n(bad),Playback(vm-incorrect)
 same => n,Hangup()
 same => n(ok),Playback(vm-youhave)
 same => n,Playback(vm-INBOX)
 same => n,Playback(beep)
 same => n,SayDigits(909042)          ; FLAG CH4
 same => n,SayDigits(909042)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; --- CH5: DTMF Decode -----------------------------------------------
; Plays a recorded burst of DTMF (flag 314159). Players capture + decode
; it with tools/dtmf_decoder.py. Build the audio: tools/gen_challenge_audio.sh
exten => 322,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(custom/dtmf-challenge)   ; missing file -> logged, call continues
 same => n,Wait(1)
 same => n,Playback(custom/dtmf-challenge)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()

; --- CH6: The Maze (IVR mapping) ------------------------------------
; Correct path: 6000 -> 3 -> 1 -> 7 reveals the flag. Wrong turns restart.
exten => 6000,1,Answer()
 same => n(m0),Read(D,vm-enter-num-to-call,1,,1,5)
 same => n,GotoIf($["${D}" = "3"]?m1:lost)
 same => n(m1),Read(D,vm-enter-num-to-call,1,,1,5)
 same => n,GotoIf($["${D}" = "1"]?m2:lost)
 same => n(m2),Read(D,vm-enter-num-to-call,1,,1,5)
 same => n,GotoIf($["${D}" = "7"]?win:lost)
 same => n(win),Playback(demo-congrats)
 same => n,Playback(beep)
 same => n,SayDigits(867530)          ; FLAG CH6 (Jenny)
 same => n,SayDigits(867530)
 same => n,Hangup()
 same => n(lost),Playback(pbx-invalid)
 same => n,Goto(m0)

; --- CH7: Milliwatt / test line -------------------------------------
; 600 = classic 1004 Hz milliwatt test tone (built-in Milliwatt app).
; After hearing it, dial 9999 for the flag.
exten => 600,1,Answer()
 same => n,Playback(hello-world)
 same => n,Milliwatt()                ; 1004 Hz until hangup

exten => 9999,1,Answer()
 same => n,Playback(beep)
 same => n,SayDigits(100461)          ; FLAG CH7
 same => n,SayDigits(100461)
 same => n,Hangup()

; --- CH8: ANAC (Automatic Number Announcement Circuit) --------------
; The classic "who am I?" line. Reads back the caller's own extension,
; then gives the flag.
exten => 958,1,Answer()
 same => n,Playback(hello-world)
 same => n,Playback(your-account-balance-is)   ; filler "your number is"
 same => n,SayDigits(${CALLERID(num)})
 same => n,Playback(beep)
 same => n,SayDigits(580019)          ; FLAG CH8
 same => n,SayDigits(580019)
 same => n,Hangup()

; =====================================================================
; FLAG TERMINAL (700) -- enter team #, then the flag code
; =====================================================================
exten => 700,1,Answer()
 same => n,Playback(hello-world)
 same => n(team),Read(TEAM,vm-enter-num-to-call,3,,2,6)
 same => n,GotoIf($["${TEAM}" = ""]?team)
 same => n(flag),Read(FLAG,vm-enter-num-to-call,6,,2,8)
 same => n,AGI(flag_check.py,${TEAM},${FLAG})
 same => n,GotoIf($["${FLAGRESULT}" = "OK"]?good)
 same => n,GotoIf($["${FLAGRESULT}" = "DUP"]?dup)
 same => n,Playback(vm-incorrect)       ; bad flag
 same => n,Goto(flag)
 same => n(good),Playback(demo-congrats)
 same => n,SayNumber(${FLAGPOINTS})
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
 same => n(dup),Playback(vm-sorry)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
