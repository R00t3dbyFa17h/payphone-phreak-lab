; =====================================================================
; payphone-phreak-lab :: pjsip.conf
; SIP transport + endpoints for softphones, the operator, and the payphone
; (via an ATA). Change the passwords before any event!  (docs/SETUP.md)
; =====================================================================

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; If you expose this beyond your LAN, set external_media_address /
; external_signaling_address and a tight local_net. For a meetup LAN,
; the defaults are fine.

; ---- Endpoint template ---------------------------------------------
[endpoint-tpl](!)
type = endpoint
context = from-phones
disallow = all
allow = ulaw
allow = alaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-tpl](!)
type = auth
auth_type = userpass

[aor-tpl](!)
type = aor
max_contacts = 1
remove_existing = yes

; ---- Helper macro-ish blocks ---------------------------------------
; For each device we declare endpoint + auth + aor with the same name.
; NOTE: default passwords are intentionally weak for a lab. CHANGE THEM.

; --- The Payphone (via ATA FXS port, or a direct SIP payphone) -------
[payphone](endpoint-tpl)
auth = payphone
aors = payphone
callerid = Payphone <1955>
[payphone](auth-tpl)
password = phreak-payphone
username = payphone
[payphone](aor-tpl)

; --- Operator (an organizer's softphone) -----------------------------
[operator](endpoint-tpl)
auth = operator
aors = operator
callerid = Operator <0>
[operator](auth-tpl)
password = phreak-operator
username = operator
[operator](aor-tpl)

; --- Team / player softphones (seed a handful) ----------------------
[team1](endpoint-tpl)
auth = team1
aors = team1
callerid = Team 1 <101>
[team1](auth-tpl)
password = phreak-team1
username = team1
[team1](aor-tpl)

[team2](endpoint-tpl)
auth = team2
aors = team2
callerid = Team 2 <102>
[team2](auth-tpl)
password = phreak-team2
username = team2
[team2](aor-tpl)

[team3](endpoint-tpl)
auth = team3
aors = team3
callerid = Team 3 <103>
[team3](auth-tpl)
password = phreak-team3
username = team3
[team3](aor-tpl)

[team4](endpoint-tpl)
auth = team4
aors = team4
callerid = Team 4 <104>
